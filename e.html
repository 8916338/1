<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
  <title>海量接口搬运备份</title>
  <link rel="icon" type="image/jpeg" href="vip/jueson.jpg">
  <style>
    /* 样式与之前保持一致，完全复用 */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    .header-block { text-align: center; margin-bottom: 16px; padding-top: 14px; }

    .copy-btn { flex-shrink: 0; background: #4a9eff; color: #fff; border: none; border-radius: 30px; padding: 0 14px; font-size: .7rem; font-weight: 500; cursor: pointer; height: 26px; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, transform .05s; white-space: nowrap; margin-left: auto; position: relative; z-index: 2; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

    body.simple-mode .nav-tabs { display: none !important; }
    body.simple-mode .tab-panel:not(#api-panel) { display: none !important; }

    /* 直播面板 */
    #live-panel { overflow-x: hidden; width: 100%; }
    .live-top-aggregate { background: linear-gradient(135deg, #4a9eff 0%, #1e6fda 100%); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; color: #fff; box-shadow: 0 4px 12px rgba(74,158,255,.3); }

    .live-top-aggregate .domain-line { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 50px; min-width: 0; }

    .live-url-body { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .live-url-tag { font-size: .68rem; font-weight: 600; color: #3a5a7a; background: #d8e8f8; padding: 2px 14px; border-radius: 50px; }
    .live-url-text { font-size: .78rem; color: #2563eb; word-break: break-all; flex: 1; min-width: 0; }

    /* 万能面板样式 */
    .has-sidebar { display: flex; flex-direction: row; gap: 12px; align-items: flex-start; width: 100%; overflow-x: hidden; }
    .panel-sidebar { flex: 0 0 auto; width: 96px; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 4px 0; position: sticky; top: 0; align-self: flex-start; max-height: 72vh; overflow-y: auto; }
    .panel-side-btn { width: 100%; padding: 11px 6px; border: 1.5px solid #4a9eff; border-radius: 12px; background: #fff; color: #4a9eff; font-size: .76rem; font-weight: 600; line-height: 1.3; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; word-break: break-word; transition: background .15s, color .15s, transform .05s; }
    .panel-side-btn .icon-box { width: 1.4rem; height: 1.4rem; font-size: 1.15rem; }
    .panel-side-btn.active { background: #4a9eff; color: #fff; }

    .panel-side-btn.panel-pinned.active { background: linear-gradient(135deg, #f5a623 0%, #e08a00 100%); color: #fff; border-color: #e08a00; }

    .panel-group.active { display: block; }

    .online-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .online-item { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e4ebf3; border-radius: 10px; padding: 12px 14px; text-decoration: none; color: inherit; transition: border-color .15s, box-shadow .15s; min-width: 0; width: 100%; }
    .online-item:active { border-color: #4a9eff; box-shadow: 0 2px 8px rgba(74,158,255,.15); }
    .online-item-icon { flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f0f3f8; }

    .online-item-icon .site-ph { font-size: 1.2rem; font-weight: 700; color: #4a9eff; }
    .online-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .online-item-name { font-size: .82rem; font-weight: 600; color: #0a1a2b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .online-item-desc { font-size: .68rem; color: #8b9eb0; margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @media (min-width: 600px) { .online-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; } }

    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; width: 100%; }
    .tool-chip { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 12px; background: #fff; border: 1px solid #e4ebf3; border-radius: 10px; text-decoration: none; color: #0a1a2b; font-size: .74rem; font-weight: 500; line-height: 1.3; text-align: center; transition: border-color .15s; min-width: 0; }

    .tool-chip .tool-icon { font-size: .9rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 1.1rem; height: 1.1rem; }
    .tool-chip .tool-icon img { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; }

    .dl-cards { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .download-card { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e4ebf3; border-radius: 10px; padding: 10px 12px; text-decoration: none; color: inherit; transition: border-color .15s; min-width: 0; width: 100%; }
    .download-card:active { border-color: #4a9eff; box-shadow: 0 2px 8px rgba(74,158,255,.15); }
    .dl-item-icon { flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f0f3f8; }
    .dl-item-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .dl-item-icon .site-ph { font-size: 1.2rem; font-weight: 700; color: #4a9eff; }
    .dl-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .dl-item-name { font-size: .82rem; font-weight: 600; color: #0a1a2b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-item-desc { font-size: .68rem; color: #8b9eb0; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-item-btn { flex-shrink: 0; height: 32px; padding: 0 14px; background: #4a9eff; color: #fff; border-radius: 30px; font-size: .7rem; font-weight: 500; line-height: 32px; cursor: pointer; white-space: nowrap; }
    .dl-item-btn:active { background: #2a7ed9; transform: scale(.96); }
    @media (min-width: 600px) { .dl-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    .dl-subgroup { margin-bottom: 16px; }
    .dl-subgroup-title { font-size: .82rem; font-weight: 600; color: #0b1e33; margin: 2px 0 8px; padding-left: 9px; border-left: 3px solid #4a9eff; }

    /* 关于页 */
    #about-panel > div { background: #f8fafc !important; border-radius: 8px !important; padding: 16px 18px !important; margin-bottom: 14px !important; border: 1px solid #e4ebf3 !important; }
    #about-panel h3 { font-size: .9rem !important; margin-bottom: 10px !important; }
    #about-panel p, #about-panel li { font-size: .75rem !important; line-height: 1.7 !important; }
    #about-domains-list { background: transparent !important; padding: 0 !important; border: none !important; margin-top: 0 !important; }
    #about-domains-list .domain-group-card { background: #fff; border: 1px solid #e4ebf3; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    #about-domains-list .domain-group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    #about-domains-list .domain-group-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #4a9eff, #1e6fda); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; overflow: hidden; }
    #about-domains-list .domain-group-avatar img { width: 100%; height: 100%; object-fit: cover; }
    #about-domains-list .domain-group-name { font-size: .85rem; font-weight: 700; color: #0a1a2b; }
    #about-domains-list .domain-line { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #f4f8fc; border-radius: 50px; margin-top: 6px; }
    #about-domains-list .domain-line .url-text { font-size: .75rem; color: #2563eb; flex: 1; }
    .contributor-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 12px; margin-top: 12px; }
    .contributor-card { background: rgba(255,255,255,.75); border-radius: 12px; padding: 12px 14px; }
    .contributor-avatar { width: 44px; height: 44px; border-radius: 50%; background: #4a9eff; color: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .contributor-avatar img { width: 100%; height: 100%; object-fit: cover; }
    #about-quick-links { display: flex !important; justify-content: center; gap: 26px; flex-wrap: wrap; margin-bottom: 8px !important; }
    .quick-item { display: flex; flex-direction: column; align-items: center; gap: 8px; background: transparent; border: none; cursor: pointer; }
    .quick-icon { width: 54px; height: 54px; display: block; }
    .quick-icon-text { font-size: 2.2rem; }
    .quick-label { font-size: .7rem !important; color: #7a8fa3; }
    .zsm-modal { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; }
    .zsm-modal.open { visibility: visible; opacity: 1; }
    .zsm-modal-mask { position: absolute; inset: 0; background: rgba(10,26,43,.62); }
    .zsm-modal-panel { position: relative; max-width: 330px; background: #fff; border-radius: 14px; padding: 18px; text-align: center; }
    .zsm-modal-panel img { max-width: 100%; max-height: 56vh; }
    .zsm-modal-close { position: absolute; top: -11px; right: -11px; width: 32px; height: 32px; border-radius: 50%; background: #4a9eff; color: #fff; border: none; font-size: 19px; cursor: pointer; }
  </style>
</head>

<body class="simple-mode">
  <div class="container">
    <button id="modeToggleBtn">切换<br>全能版</button>

    <div class="header-block">
      <h1><img class="header-logo" id="header-logo" src="" alt="Logo"><span id="header-title"></span></h1>
      <div class="header-divider"></div>
      <p class="subtitle" id="header-subtitle"></p>
    </div>

    <div class="main-card" id="mainCard">
      <div class="nav-tabs" id="navTabs"></div>
      <input class="search-box" id="search" type="text" placeholder="" oninput="globalSearch()">

      <!-- 固定页面：点播 -->
      <div class="tab-panel active" id="api-panel">
        <div class="api-list" id="listContainer"><div class="loading" id="apiLoading">⏳ 加载中...</div></div>
      </div>

      <!-- 固定页面：直播 -->
      <div class="tab-panel" id="live-panel">
        <div class="live-top-aggregate">
          <h3 id="liveAggTitle"></h3>
          <div class="domain-line"><span id="liveAggUrl"></span><button class="copy-btn" id="liveAggCopy" data-url="">复制</button></div>
        </div>
        <div class="live-list" id="liveListContainer"><div class="loading" id="liveLoading">⏳ 加载中...</div></div>
      </div>

      <!-- 固定页面：关于 -->
      <div class="tab-panel" id="about-panel">
        <div><h3>🌐 备份线路域名</h3><div id="about-domains-list"></div></div>
        <div>
          <h3>🤝 合作共创</h3>
          <div class="contributor-grid" id="contributors-list"></div>
          <p id="contributors-note" style="font-size: .68rem; color: #8fa3b8; margin-top: 10px;"></p>
        </div>
        <div><h3>📢 声明与联系</h3><ul style="padding-left: 16px;"><li id="about-declaration" style="font-size: .76rem;"></li></ul></div>
      </div>

      <!-- 动态插入的页面将放在这里 -->
      <div id="dynamicPanelsContainer"></div>

    </div>

    <footer class="page-footer">
      <div id="about-quick-links"></div>
      <p id="footer-text"></p>
    </footer>
  </div>

  <div class="zsm-modal" id="zsmModal">
    <div class="zsm-modal-mask" data-close></div>
    <div class="zsm-modal-panel">
      <button class="zsm-modal-close" data-close>×</button>
      <div id="zsmModalTitle" style="font-weight: bold; margin-bottom: 10px;"></div>
      <img id="zsmModalImg" src="" alt="赞赏码">
      <p id="zsmModalTip" style="font-size: .72rem; margin-top: 12px;"></p>
    </div>
  </div>

  <script>
    const MODE_KEY = 'site_mode';
    const TAB_KEY = 'current_tab';
    let SITE_CONFIG = null;
    let TABS = [];
    let currentTabId = 'api';
    let currentMode = localStorage.getItem(MODE_KEY) || 'simple';

    const searchBox = document.getElementById('search');
    const mainCard = document.getElementById('mainCard');
    const dynamicContainer = document.getElementById('dynamicPanelsContainer');

    document.body.className = currentMode + '-mode';
    document.getElementById('modeToggleBtn').innerHTML = currentMode === 'simple' ? '切换<br>全能版' : '切换<br>简洁版';

    // 通用工具函数
    function isImageIcon(icon) { return typeof icon === 'string' && (/^(https?:)?\/\//i.test(icon) || /^(\.{1,2}\/|\/)/.test(icon) || /\.(png|jpe?g|gif|webp|svg|ico)(\?.*)?$/i.test(icon)); }
    function getInitials(name) { return name ? name.slice(0,1).toUpperCase() : '?'; }
    function renderIcon(icon, opts = {}) {
      const val = icon && String(icon).trim() ? icon : (opts.fallback || '📌');
      if (isImageIcon(val)) return `<span class="icon-box" style="width:${opts.box||'1.4rem'};height:${opts.box||'1.4rem'}"><img src="${val}" alt="" onerror="this.style.display='none';this.parentNode.textContent='${opts.fallback}'"></span>`;
      return `<span class="icon-box" style="font-size:${opts.size||'1.1rem'}">${val}</span>`;
    }
    async function fetchJSON(url) {
      const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    // 万能面板渲染引擎 (自动处理 online/tools/api/download)
    async function renderDynamicPanel(dataArray, containerId, defaultType = 'api') {
      const container = document.getElementById(containerId);
      if (!container) return;

      // 标准化数据
      const tabs = (dataArray || []).map(t => ({
        id: t.id || t.name || t.label || Math.random().toString(36).slice(2),
        label: t.label || t.name || '未命名',
        icon: t.icon || '',
        file: t.file || t.url || '',
        type: t.type || defaultType,
        pinned: !!t.pinned,
        description: t.description || ''
      }));

      if (!tabs.length) { container.innerHTML = '<div class="error-msg">⚠️ 暂无数据</div>'; return; }

      const pinned = tabs.filter(t => t.pinned);
      const normal = tabs.filter(t => !t.pinned);
      const ordered = pinned.concat(normal);

      container.className = 'has-sidebar';
      container.innerHTML = `<div class="panel-sidebar" id="${containerId}-sb"></div><div class="panel-body" id="${containerId}-body"><div class="loading">⏳ 加载中...</div></div>`;

      // 侧边栏
      const sb = document.getElementById(`${containerId}-sb`);
      sb.innerHTML = ordered.map((t, i) => {
        const isPinned = t.pinned;
        const div = isPinned && i === pinned.length - 1 && normal.length > 0 ? '<div class="panel-divider"></div>' : '';
        return `<button class="panel-side-btn ${isPinned ? 'panel-pinned' : ''} ${i===0?'active':''}" data-tid="${t.id}">${renderIcon(t.icon)}<span>${t.label}</span></button>` + div;
      }).join('');

      // 加载数据
      const dataMap = {};
      await Promise.all(ordered.map(async t => {
        if (!t.file) { dataMap[t.id] = { items: [] }; return; }
        try {
          if (t.type === 'download' || t.file.includes('下载')) {
            // 兼容清洗非法 JSON 标点
            const res = await fetch(t.file + '?t=' + Date.now(), { cache: 'no-store' });
            const raw = await res.text();
            const cleaned = raw.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/：/g, ':').replace(/，/g, ',');
            const data = JSON.parse(cleaned);
            let groups = [];
            const arr = data.list || data;
            if (Array.isArray(arr)) {
              arr.forEach(g => g && Array.isArray(g.list) ? groups.push({name: g.name, list: g.list}) : groups.push({name: '', list: [g]}));
            }
            dataMap[t.id] = { groups, title: data.title, description: data.description };
          } else {
            dataMap[t.id] = await fetchJSON(t.file);
          }
        } catch (e) { dataMap[t.id] = { error: e.message }; }
      }));

      // 渲染内容
      const body = document.getElementById(`${containerId}-body`);
      body.innerHTML = ordered.map((t, i) => {
        const data = dataMap[t.id];
        const isActive = i === 0 ? 'active' : '';
        if (data.error) return `<div class="panel-group ${isActive}"><div class="error-msg">❌ ${t.label} 加载失败：${data.error}</div></div>`;

        let html = '';
        if (data.groups) {
          // 渲染下载列表
          const groupsHtml = data.groups.map(g => {
            if (!g.list.length) return '';
            const cards = g.list.map(item => {
              const ph = (item.name||'?').slice(0,1).toUpperCase();
              const ico = isImageIcon(item.icon) ? `<img src="${item.icon}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="site-ph" style="display:none">${ph}</span>` : `<span class="site-ph">${item.icon || ph}</span>`;
              return `<a class="download-card" href="${item.url || '#'}" target="_blank"><span class="dl-item-icon">${ico}</span><span class="dl-item-info"><span class="dl-item-name">${item.name}</span>${item.version?`<span class="dl-item-desc">${item.version}</span>`:''}</span><span class="dl-item-btn">⬇ 下载</span></a>`;
            }).join('');
            return `<div class="dl-subgroup">${g.name?`<div class="dl-subgroup-title">${g.name}</div>`:''}<div class="dl-cards">${cards}</div></div>`;
          }).join('');
          html = `<div style="background:#f8fafc;border-radius:12px;padding:14px 16px;border:1px solid #eef2f7"><h3 style="font-size:.92rem;margin-bottom:4px">${data.title||t.label}</h3><p style="font-size:.76rem;color:#5a6f88;margin-bottom:10px">${data.description||''}</p>${groupsHtml}</div>`;
        } else {
          // 渲染 items (online/tools/api)
          const items = data.items || [];
          let inner = '';
          if (t.type === 'online') {
            inner = `<div class="online-list">${items.map(item => {
              const ph = (item.name||'?').slice(0,1).toUpperCase();
              const ico = isImageIcon(item.icon) ? `<img src="${item.icon}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="site-ph" style="display:none">${ph}</span>` : `<span class="site-ph">${item.icon || ph}</span>`;
              return `<a class="online-item" href="${item.url}" target="_blank"><span class="online-item-icon">${ico}</span><div class="online-item-info"><div class="online-item-name">${item.name}</div><div class="online-item-desc">${item.desc}</div></div></a>`;
            }).join('')}</div>`;
          } else if (t.type === 'tools') {
            inner = `<div class="tools-grid">${items.map(item => `<a class="tool-chip" href="${item.url}" target="_blank">${renderIcon(item.icon, {size:'.9rem', box:'1.1rem', fallback:'🔗'})}<span>${item.name}</span></a>`).join('')}</div>`;
          } else {
            inner = `<div class="api-list">${items.map(item => `<div class="api-item"><div class="api-item-header"><div class="api-item-name">${item.name}</div></div><div class="url-line"><span class="url-tag">${item.tag||'接口'}</span><span class="url-text">${item.url}</span><button class="copy-btn" data-url="${item.url}">复制</button></div></div>`).join('')}</div>`;
          }
          html = `<div style="background:#f8fafc;border-radius:12px;padding:14px 16px;border:1px solid #eef2f7"><h3 style="font-size:.92rem;margin-bottom:4px">${data.title||t.label}</h3><p style="font-size:.76rem;color:#6a7f93;margin-bottom:10px">${data.description||''}</p>${inner}</div>`;
        }
        return `<div class="panel-group ${isActive}" id="grp-${t.id}">${html}</div>`;
      }).join('');

      // 侧边栏交互
      sb.querySelectorAll('.panel-side-btn').forEach(b => {
        b.onclick = () => {
          sb.querySelectorAll('.panel-side-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          body.querySelectorAll('.panel-group').forEach(x => x.classList.remove('active'));
          document.getElementById(`grp-${b.dataset.tid}`).classList.add('active');
        };
      });
    }

    // 初始化配置
    async function loadConfig() {
      SITE_CONFIG = await fetchJSON('config.json');
      const site = SITE_CONFIG.site || {};
      document.getElementById('header-logo').src = site.logo || '';
      document.getElementById('header-title').textContent = site.title || '';
      document.getElementById('header-subtitle').innerHTML = `${site.subtitle||''}<br><a class="qq-link" href="${site.qqUrl||'#'}" target="_blank">${site.qqText||''}<span style="color:#00C853;">${site.qqHighlight||''}</span></a>`;
      document.getElementById('footer-text').textContent = site.footer || '';
      searchBox.placeholder = (SITE_CONFIG.search && SITE_CONFIG.search.placeholder) || '🔍 搜索...';
      
      const agg = SITE_CONFIG.liveAggregate || {};
      document.getElementById('liveAggTitle').textContent = agg.title || '';
      document.getElementById('liveAggUrl').textContent = agg.url || '';
      document.getElementById('liveAggCopy').dataset.url = agg.url || '';

      TABS = SITE_CONFIG.tabs || [];

      // 动态构建所有 tab 容器
      TABS.forEach(tab => {
        if (!['api', 'live', 'about'].includes(tab.id)) {
          const div = document.createElement('div');
          div.className = 'tab-panel';
          div.id = `${tab.id}-panel`;
          div.innerHTML = `<div id="${tab.id}-content"></div>`;
          dynamicContainer.appendChild(div);
        }
      });

      currentTabId = TABS.find(t => t.id === localStorage.getItem(TAB_KEY)) ? localStorage.getItem(TAB_KEY) : TABS[0].id;
      renderTabs();
      renderAbout();
      switchPanel(currentTabId);
    }

    // 渲染顶部导航
    function renderTabs() {
      document.getElementById('navTabs').innerHTML = TABS.map(t => `<button class="nav-tab ${t.id===currentTabId?'active':''}" data-id="${t.id}">${t.label}</button>`).join('');
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          switchPanel(btn.dataset.id);
        };
      });
    }

    // 页面切换与加载
    async function switchPanel(tabId) {
      currentTabId = tabId;
      localStorage.setItem(TAB_KEY, tabId);
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`${tabId}-panel`).classList.add('active');

      const tabCfg = TABS.find(t => t.id === tabId);
      if (!tabCfg) return;

      // 【核心】如果是自带数据的页面，自动去 config 根节点找对应的数组
      if (tabCfg.data && SITE_CONFIG[tabCfg.data]) {
        await renderDynamicPanel(SITE_CONFIG[tabCfg.data], `${tabId}-content`, tabCfg.defaultType || 'api');
      } else if (tabId === 'api') {
        renderApi();
      } else if (tabId === 'live') {
        renderLive();
      }
    }

    // 点播、直播、关于等基础逻辑（略作精简）
    async function renderApi() { /* ...原有代码... */ }
    async function renderLive() { /* ...原有代码... */ }
    function renderAbout() { /* ...原有代码... */ }

    // 复制逻辑
    document.addEventListener('click', e => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        btn.textContent = '✅ 已复制'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
      });
    });

    // 简易搜索
    function globalSearch() {
      const kw = searchBox.value.toLowerCase();
      document.querySelectorAll('.api-item, .live-item, .download-card, .online-item, .tool-chip').forEach(el => {
        const name = el.dataset.name || el.textContent.toLowerCase();
        el.style.display = name.includes(kw) ? '' : 'none';
      });
    }

    // 启动
    loadConfig().catch(e => document.getElementById('listContainer').innerHTML = `<div class="error-msg">❌ 配置加载失败：${e.message}</div>`);
  </script>
</body>
</html>
