<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>闪电球</title>
<style>
  :root{
    --primary:#3b82f6;
    --primary-dark:#2563eb;
    --text:#1f2937;
    --sub:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:linear-gradient(165deg,#eef2ff 0%,#f6f7fb 45%,#f6f7fb 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
  }

  .card{
    width:100%;max-width:380px;
    background:#fff;border-radius:20px;
    padding:28px 24px 24px;
    box-shadow:0 12px 40px rgba(31,41,55,.10);
    text-align:center;
    animation:pop .35s cubic-bezier(.22,1,.36,1);
  }
  @keyframes pop{
    from{opacity:0;transform:translateY(14px) scale(.98);}
    to{opacity:1;transform:none;}
  }

  .icon{
    width:66px;height:66px;margin:0 auto 14px;
    border-radius:20px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#dbeafe,#eef2ff);
    box-shadow:inset 0 -2px 6px rgba(59,130,246,.10);
  }
  .icon img{
    display:block;width:100%;height:100%;
    object-fit:cover;
  }

  .title{
    margin:0;font-size:19px;font-weight:600;letter-spacing:.2px;
  }
  .version{
    margin-top:8px;font-size:15px;font-weight:600;color:var(--primary);
    letter-spacing:.4px;
  }
  .version .code{
    font-size:13px;font-weight:400;color:var(--sub);margin-left:2px;
  }

  .log-box{
    margin:20px 0;padding:14px 16px;
    border-radius:12px;background:#f8fafc;border:1px solid #eef2f7;
    text-align:left;
  }
  .log-label{
    font-size:12px;font-weight:600;color:var(--sub);
    letter-spacing:.6px;margin-bottom:8px;
  }
  .log-content{
    font-size:14px;line-height:1.75;color:#374151;
    white-space:pre-wrap;word-break:break-word;
  }

  .btn{
    display:block;width:100%;height:48px;border:0;border-radius:12px;
    font-size:16px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    box-shadow:0 6px 18px rgba(59,130,246,.32);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:active{transform:scale(.98);box-shadow:0 4px 12px rgba(59,130,246,.26);}
  .btn:disabled{
    background:#c7d2fe;box-shadow:none;cursor:not-allowed;
  }

  .tip{
    margin-top:14px;min-height:18px;
    font-size:12px;line-height:1.7;color:var(--sub);
  }
  .tip.warn{color:#d97706;font-weight:500;}
  .tip.error{color:#dc2626;font-weight:500;}
  .tip a{color:var(--primary);word-break:break-all;text-decoration:none;}
</style>
</head>
<body>

<div class="card">

  <div class="icon">
    <img src="./logo.png" alt="logo">
  </div>

  <h1 class="title" id="title">最新版本</h1>

  <div class="version">
    <span id="versionName">—</span>
    <span class="code" id="versionCode"></span>
  </div>

  <div class="log-box">
    <div class="log-label">更新内容</div>
    <div class="log-content" id="changelog">加载中…</div>
  </div>

  <button class="btn" id="downloadBtn" type="button" disabled>获取版本信息…</button>

  <div class="tip" id="tip">正在获取版本信息…</div>

</div>

<script>
(function () {
  'use strict';

  /* ========== 配置 ========== */
  var CONFIG_URL = './update.json';

  /* ========== DOM ========== */
  var $ = function (id) { return document.getElementById(id); };
  var elVersion   = $('versionName');
  var elCode      = $('versionCode');
  var elChangelog = $('changelog');
  var elBtn       = $('downloadBtn');
  var elTip       = $('tip');

  /* ========== 工具 ========== */
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizeUrl(url) {
    if (!url) return '';
    try { return encodeURI(url); } catch (e) { return url; }
  }

  function isWeChat() { return /MicroMessenger|QQ\//i.test(navigator.userAgent); }
  function isAndroid() { return /Android/i.test(navigator.userAgent); }

  /* ========== 渲染 ========== */
  function renderError(msg) {
    elVersion.textContent = '—';
    elCode.textContent = '';
    elChangelog.textContent = '—';
    elBtn.disabled = true;
    elBtn.textContent = '暂无可用版本';
    elTip.className = 'tip error';
    elTip.textContent = msg;
  }

  function render(info) {
    var versionName = info.versionName || '未知版本';
    var versionCode = info.versionCode != null ? info.versionCode : '';
    var changelog   = info.changelog || '暂无更新说明';
    var downloadUrl = normalizeUrl(info.downloadUrl);

    elVersion.textContent = 'v' + versionName;
    elCode.textContent    = versionCode !== '' ? '(' + versionCode + ')' : '';
    elChangelog.textContent = changelog;

    if (!downloadUrl) {
      elBtn.disabled = true;
      elBtn.textContent = '暂无下载地址';
      elTip.className = 'tip warn';
      elTip.textContent = '未提供下载地址，请稍后再试。';
      return;
    }

    elBtn.disabled = false;
    elBtn.textContent = '下载';

    elBtn.onclick = function () {
      elBtn.disabled = true;
      elBtn.textContent = '正在下载…';
      window.location.href = downloadUrl;
      setTimeout(function () {
        elBtn.disabled = false;
        elBtn.textContent = '下载';
      }, 2000);
    };

    elTip.className = 'tip';
    if (isWeChat()) {
      elTip.className = 'tip warn';
      elTip.innerHTML =
        '当前为微信/QQ 内置浏览器，可能无法直接下载。<br>' +
        '请点击右上角「···」→「在浏览器中打开」后再下载。';
    } else if (!isAndroid()) {
      elTip.innerHTML =
        '当前设备非 Android，安装包可能无法直接安装。<br>' +
        '下载地址：<a href="' + escapeHtml(downloadUrl) + '">' + escapeHtml(downloadUrl) + '</a>';
    } else {
      elTip.innerHTML =
        '若点击无反应，可长按复制下载链接：<br>' +
        '<a href="' + escapeHtml(downloadUrl) + '">' + escapeHtml(downloadUrl) + '</a>';
    }
  }

  /* ========== 拉取 update.json ========== */
  function fetchConfig() {
    var url = CONFIG_URL + (CONFIG_URL.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
    return fetch(url, {
      method: 'GET',
      cache: 'no-store',
      headers: { 'Accept': 'application/json' }
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  /* ========== 启动 ========== */
  fetchConfig()
    .then(function (data) {
      if (!data || typeof data !== 'object') throw new Error('JSON 格式异常');
      render(data);
    })
    .catch(function (err) {
      console.warn('[version] 读取 update.json 失败：', err);
      renderError('获取版本信息失败，请检查网络或 update.json 是否可访问。');
    });

})();
</script>
</body>
</html>
